<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1d"><link rel="manifest" href="manifest.json">
<title>Cashier Skate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{
 --bg:#06091a;--panel:#0d1630;--panel2:#111d3c;--cyan:#55e8ff;--blue:#477cff;
 --purple:#a05cff;--pink:#ff4f9a;--gold:#ffb94a;--green:#45efae;--red:#ff5b79;
 --text:#f3f7ff;--muted:#8795b7;--line:rgba(91,205,255,.22);
}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0%,#18245a 0,#080d24 35%,#040712 100%);color:var(--text);font-family:Cairo,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit} button{border:0;color:inherit;cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:94px;position:relative;overflow:hidden}
.bgglow{position:fixed;inset:auto -100px -100px auto;width:350px;height:350px;background:radial-gradient(circle,rgba(125,72,255,.28),transparent 68%);pointer-events:none}
.top{padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:22px;font-weight:900;letter-spacing:.8px}.sub{color:var(--muted);font-size:12px}
.live{padding:7px 13px;border:1px solid rgba(69,239,174,.5);border-radius:30px;background:rgba(31,190,137,.12);color:var(--green);font-weight:800}
main{padding:8px 16px}
.hero{border:1px solid var(--line);border-radius:28px;padding:20px;background:linear-gradient(145deg,rgba(27,59,100,.75),rgba(10,18,45,.88));box-shadow:0 0 35px rgba(45,167,255,.08),inset 0 0 30px rgba(70,117,255,.06)}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.label{color:#9eacd0;font-size:14px}.money{font-size:40px;font-weight:900;line-height:1.15}.cyan{color:var(--cyan)}
.progress{height:8px;background:#050a19;border-radius:10px;margin-top:15px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));box-shadow:0 0 14px #5beaff}
.goal{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.sectionHead h2{margin:0;font-size:21px}.tiny{color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:linear-gradient(150deg,rgba(18,32,66,.94),rgba(8,15,35,.96));border:1px solid var(--line);border-radius:23px;padding:14px;position:relative;overflow:hidden;box-shadow:inset 0 0 22px rgba(76,118,255,.035)}
.card:after{content:"";position:absolute;width:100px;height:100px;left:-50px;bottom:-50px;background:radial-gradient(circle,rgba(85,232,255,.14),transparent 70%);pointer-events:none}
.card.ticket{--accent:var(--cyan)} .card.dolphin{--accent:var(--purple)} .card.cart{--accent:var(--pink)} .card.subs{--accent:var(--gold)}
.icon{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;color:var(--accent);font-size:23px;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 18%,transparent)}
.name{font-weight:800;font-size:16px;margin-top:9px}.price{color:#a8b4d0;font-size:12px}.ctotal{font-size:23px;font-weight:900;margin-top:14px}.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.count{font-size:21px;font-weight:900}.pm{width:40px;height:40px;border-radius:13px;background:#15264a;border:1px solid rgba(91,205,255,.24);font-size:24px}.pm.plus{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 13%,transparent)}
.pm:active{transform:scale(.9)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{padding:13px;border-radius:17px;background:linear-gradient(135deg,#1d4eff,#8b38ff);font-weight:900;box-shadow:0 0 22px rgba(89,83,255,.22)}.btn.secondary{background:#111c3b;border:1px solid var(--line);box-shadow:none}.btn.success{background:linear-gradient(135deg,#0f9271,#27e9a7);color:#03150f}.btn.warn{background:linear-gradient(135deg,#a72e55,#ff6a68)}
.panel{background:linear-gradient(145deg,rgba(17,31,62,.95),rgba(8,15,35,.97));border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:19px;background:#0c1733;border:1px solid rgba(113,136,255,.2)}.stat b{display:block;font-size:22px;margin-top:3px}.stat span{font-size:11px;color:var(--muted)}
.screenTitle{font-size:31px;font-weight:900;margin:6px 0 3px}.screenSub{color:var(--muted);font-size:12px;margin-bottom:16px}
.cashrow{display:grid;grid-template-columns:70px 1fr 42px 42px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(150,170,220,.1)}.cashrow:last-child{border-bottom:0}.denom{font-weight:900;color:var(--cyan)}.cashqty{text-align:center;font-weight:900;font-size:20px}.smallbtn{width:42px;height:42px;border-radius:13px;background:#132349;border:1px solid var(--line);font-size:21px}.rowtotal{text-align:left;color:#d9e5ff;font-size:12px}
input{width:100%;background:#08122b;border:1px solid var(--line);border-radius:15px;padding:13px;color:white;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(85,232,255,.12)}
.field{margin-bottom:12px}.field label{display:block;color:#a9b6d4;font-size:12px;margin-bottom:5px}
.audit{margin-top:12px;padding:15px;border-radius:20px;background:#09152e;border:1px solid rgba(85,232,255,.16)}.ok{color:var(--green)}.bad{color:var(--red)}.auditline{display:flex;justify-content:space-between;padding:7px 0;color:#b8c5df;font-size:13px}.auditline strong{color:white}
.historyItem{padding:14px;border-radius:18px;background:#0b1733;border:1px solid rgba(85,232,255,.14);margin-bottom:9px}.historyTop{display:flex;justify-content:space-between}.badge{padding:3px 9px;border-radius:20px;background:rgba(69,239,174,.12);color:var(--green);font-size:10px}
.settingsRow{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid rgba(150,170,220,.1)}.switch{width:50px;height:28px;border-radius:30px;background:#23345a;padding:3px}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#7889ad;transition:.2s}.switch.on{background:#167e89}.switch.on i{transform:translateX(22px);background:var(--cyan)}
.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:8px;background:rgba(6,12,30,.92);backdrop-filter:blur(18px);border:1px solid rgba(93,188,255,.22);border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,.45);z-index:50}
.nav{background:transparent;padding:7px 2px;border-radius:18px;color:#7788ad;font-size:10px}.nav span{display:block;font-size:22px;line-height:23px}.nav.active{background:linear-gradient(135deg,rgba(66,122,255,.25),rgba(132,53,255,.2));color:var(--cyan);box-shadow:0 0 18px rgba(78,211,255,.1)}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130%);width:min(430px,calc(100% - 30px));padding:15px 18px;border-radius:20px;background:#101d3c;border:1px solid var(--cyan);box-shadow:0 0 35px rgba(85,232,255,.25);z-index:100;text-align:center;font-weight:800;transition:.35s}.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(2,5,15,.75);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:90}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#0b1530;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px;box-shadow:0 -15px 50px rgba(0,0,0,.5)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}.piece{position:absolute;width:7px;height:13px;animation:fall 1.2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}@keyframes pulse{50%{box-shadow:0 0 30px rgba(85,232,255,.35)}}.pulse{animation:pulse .7s ease}
.empty{text-align:center;padding:42px 15px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:360px){.money{font-size:34px}.screenTitle{font-size:27px}}

/* Enhanced cashier effects */
body.fx-flash::before{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;background:radial-gradient(circle at center,rgba(85,232,255,.22),transparent 55%);animation:screenFlash .45s ease-out forwards}
@keyframes screenFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.fx-shake{animation:shake .38s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.plus-burst{position:fixed;z-index:125;pointer-events:none;font-size:28px;font-weight:900;color:var(--cyan);text-shadow:0 0 18px currentColor;animation:burstUp .65s ease-out forwards}
@keyframes burstUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-115px) scale(1.25);opacity:0}}
.milestone{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.75);z-index:130;width:min(360px,calc(100% - 40px));padding:26px 20px;border-radius:28px;text-align:center;background:linear-gradient(145deg,#111f48,#080d20);border:2px solid var(--purple);box-shadow:0 0 55px rgba(160,92,255,.55),inset 0 0 35px rgba(85,232,255,.08);animation:milestoneIn .3s ease-out forwards}
.milestone .big{font-size:56px;line-height:1}.milestone h2{margin:8px 0 4px;font-size:27px}.milestone p{margin:0;color:var(--muted);font-size:13px}
@keyframes milestoneIn{to{transform:translate(-50%,-50%) scale(1)}}
.milestone.hide{animation:milestoneOut .35s ease-in forwards}
@keyframes milestoneOut{to{transform:translate(-50%,-50%) scale(.8);opacity:0}}
</style>
</head>
<body>
<div class="app" id="app"><div class="bgglow"></div><div id="toast" class="toast"></div><main id="main"></main></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='cashier_skate_v1';
const defaults={prices:{ticket:140,dolphin:30,cart:35,subs:850},goal:5000,sounds:true,vibrate:true,visuals:true,day:null,counts:{ticket:0,dolphin:0,cart:0,subs:0},cash:{200:0,100:0,50:0,20:0,10:0,5:0},firstTicket:'',lastTicket:'',history:[]};
let s=load(), screen='home';
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function today(){return new Intl.DateTimeFormat('ar-EG',{dateStyle:'long'}).format(new Date())}
function ensureDay(){if(s.day!==today()){s.day=today();s.counts={ticket:0,dolphin:0,cart:0,subs:0};s.cash={200:0,100:0,50:0,20:0,10:0,5:0};s.firstTicket='';s.lastTicket='';save()}}
ensureDay();
const names={ticket:'تذكرة الاسكيت',dolphin:'دولفين / سنادة',cart:'عربية بضائع',subs:'اشتراك'};
const icons={ticket:'🎟️',dolphin:'〰',cart:'🛒',subs:'▣'};
function totalSales(){return Object.keys(s.counts).reduce((a,k)=>a+s.counts[k]*s.prices[k],0)}
function cashTotal(){return Object.entries(s.cash).reduce((a,[d,q])=>a+Number(d)*q,0)}
function ops(){return Object.values(s.counts).reduce((a,b)=>a+b,0)}
function ticketExpected(){if(s.firstTicket===''||s.lastTicket==='')return null;const a=Number(s.firstTicket),b=Number(s.lastTicket);return b>=a?b-a:null}
function ticketExpectedMoney(){const n=ticketExpected();return n==null?null:n*s.prices.ticket}
function fmt(n){return new Intl.NumberFormat('ar-EG').format(n)}
let audioCtx=null;
function unlockAudio(){if(!s.sounds)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function sound(type='click'){if(!s.sounds)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();const c=audioCtx,now=c.currentTime;const seq=type==='success'?[660,880,1046]:type==='warn'?[220,165,220]:type==='add'?[520,760]:[440];seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=type==='warn'?'sawtooth':'sine';o.frequency.value=f;const t=now+i*(type==='success'?.10:type==='add'?.055:.06);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='warn'?.055:.045,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+(type==='success'?.14:.10));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.18)})}catch{}}
function buzz(pattern=[45]){if(s.vibrate&&navigator.vibrate)navigator.vibrate(pattern)}
function toast(t,type='info'){const x=document.getElementById('toast');x.textContent=t;x.className='toast show';if(type==='success'){sound('success');buzz([45,35,70])}else if(type==='warn'){sound('warn');buzz([70,40,70])}else sound();setTimeout(()=>x.className='toast',2300)}
function confetti(){if(!s.visuals)return;const c=document.createElement('div');c.className='confetti';for(let i=0;i<65;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.top='-20px';p.style.transform=`rotate(${Math.random()*360}deg)`;p.style.background=['#55e8ff','#a05cff','#ff4f9a','#ffb94a','#45efae'][i%5];p.style.animationDelay=Math.random()*.35+'s';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}
function screenFlash(){if(!s.visuals)return;document.body.classList.remove('fx-flash');void document.body.offsetWidth;document.body.classList.add('fx-flash');setTimeout(()=>document.body.classList.remove('fx-flash'),500)}
function shakeApp(){if(!s.visuals)return;const a=document.getElementById('app');a.classList.remove('fx-shake');void a.offsetWidth;a.classList.add('fx-shake');setTimeout(()=>a.classList.remove('fx-shake'),420)}
function plusBurst(el,text='+'){if(!s.visuals||!el)return;const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='plus-burst';b.textContent=text;b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top+r.height/2)+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),700)}
function milestone(n){if(!s.visuals)return;const old=document.querySelector('.milestone');if(old)old.remove();const m=document.createElement('div');m.className='milestone';m.innerHTML=`<div class="big">🐬</div><h2>وصلت لـ ${n} دولفين!</h2><p>علامة كل 10 دلافين — راجع العدد قبل ما تكمل.</p>`;document.body.appendChild(m);screenFlash();shakeApp();confetti();setTimeout(()=>{m.classList.add('hide');setTimeout(()=>m.remove(),360)},2100)}
function setScreen(x){unlockAudio();sound();screen=x;render();window.scrollTo({top:0,behavior:'smooth'})}
function change(k,d,el){unlockAudio();const before=s.counts[k];s.counts[k]=Math.max(0,before+d);save();if(d>0){sound('add');buzz([18]);plusBurst(el,'+');if(s.visuals)screenFlash()}else sound();if(k==='dolphin'){const n=s.counts.dolphin;if(d>0&&n>0&&n%10===0&&before!==n){milestone(n);toast(`وصلت لـ ${n} دلافين — راجع العدد`,'warn')}}render()}
document.addEventListener('pointerdown',unlockAudio,{once:false});
function serviceCard(k){return `<div class="card ${k}"><div class="icon">${icons[k]}</div><div class="name">${names[k]}</div><div class="price">${fmt(s.prices[k])} ج</div><div class="ctotal">${fmt(s.counts[k]*s.prices[k])}<small> ج</small></div><div class="controls"><button class="pm" onclick="change('${k}',-1,this)">−</button><div class="count">${fmt(s.counts[k])}</div><button class="pm plus" onclick="change('${k}',1,this)">+</button></div></div>`}
function header(title,sub){return `<div class="top"><div><div class="brand">CASHIER SKATE</div><div class="sub">${sub||'لوحة الكاشير اليومية'}</div></div><div class="live">● مباشر</div></div><div style="padding:0 16px"><div class="screenTitle">${title}</div><div class="screenSub">${today()}</div></div>`}
function render(){
ensureDay();
let h='';
if(screen==='home') h=home();
if(screen==='ops') h=operations();
if(screen==='cash') h=cashScreen();
if(screen==='history') h=history();
if(screen==='settings') h=settings();
if(screen==='audit') h=audit();
if(screen==='close') h=closeScreen();
document.getElementById('main').innerHTML=h+nav();
}
function home(){
const sales=totalSales(),pct=Math.min(100,Math.round(sales/s.goal*100));
return header('','شيفت جديد — جاهز للشغل؟')+`<section class="hero"><div class="heroRow"><div><div class="label">إجمالي الشغل الحالي</div><div class="money">${fmt(sales)} <small>ج</small></div></div><div class="icon" style="--accent:var(--cyan);font-size:25px">⚡</div></div><div class="label" style="margin-top:8px">${fmt(ops())} عملية مسجلة اليوم</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="goal"><span>التقدم نحو الهدف</span><span>${pct}%</span></div></section>
<div class="sectionHead"><h2>البيع السريع</h2><span class="tiny">اضغط + للتسجيل</span></div><div class="grid">${serviceCard('ticket')}${serviceCard('dolphin')}${serviceCard('cart')}${serviceCard('subs')}</div>
<div class="actions"><button class="btn" onclick="setScreen('close')">إغلاق الحساب</button><button class="btn secondary" onclick="setScreen('audit')">مراجعة الشغل</button><button class="btn secondary" onclick="setScreen('cash')">عد الفلوس</button><button class="btn secondary" onclick="setScreen('ops')">تفاصيل البيع</button></div>
<div class="panel"><div class="sectionHead" style="margin-top:0"><h2>حالة الدلافين</h2><span class="tiny">${s.counts.dolphin%10===0&&s.counts.dolphin>0?'راجع العدد':''}</span></div><div style="font-size:28px;font-weight:900">${fmt(s.counts.dolphin)} <span style="font-size:14px;color:var(--muted)">/ 10</span></div><div class="progress"><div class="bar" style="width:${Math.min(100,(s.counts.dolphin%10)/10*100)}%"></div></div></div>`;
}
function operations(){
return header('العمليات','سجل كل عملية بسرعة')+`<div class="statgrid"><div class="stat"><span>إجمالي العمليات</span><b>${fmt(ops())}</b></div><div class="stat"><span>إجمالي المبيعات</span><b>${fmt(totalSales())} ج</b></div></div><div class="sectionHead"><h2>تفاصيل البيع</h2></div><div class="grid">${serviceCard('ticket')}${serviceCard('dolphin')}${serviceCard('cart')}${serviceCard('subs')}</div>`;
}
function cashScreen(){
const den=[200,100,50,20,10,5];return header('عد الفلوس','سجل كل فئة بدقة')+`<div class="panel"><div class="sectionHead" style="margin-top:0"><h2>الفئات النقدية</h2><span class="tiny">عدد الأوراق</span></div>${den.map(d=>`<div class="cashrow"><div class="denom">${d} ج</div><div class="rowtotal">${fmt(d*s.cash[d])} ج</div><button class="smallbtn" onclick="cashChange(${d},-1)">−</button><div class="cashqty">${fmt(s.cash[d])}</div><button class="smallbtn" onclick="cashChange(${d},1)">+</button></div>`).join('')}</div><div class="panel" style="border-color:rgba(69,239,174,.45)"><div class="label">إجمالي النقدية</div><div class="money" style="color:var(--green)">${fmt(cashTotal())} ج</div></div><button class="btn" style="width:100%;margin-top:12px" onclick="setScreen('close')">مقارنة المبيعات بالنقدية</button>`;
}
function cashChange(d,x){unlockAudio();s.cash[d]=Math.max(0,s.cash[d]+x);save();sound('add');if(x>0)buzz([12]);render()}
function audit(){
const n=ticketExpected(), rec=s.counts.ticket, expMoney=ticketExpectedMoney(), recMoney=rec*s.prices.ticket;
let valid=n!==null;let diff=valid?n-rec:null;
return header('مراجعة التذاكر','راجع أرقام التذاكر والمبيعات')+`<div class="panel"><div class="field"><label>رقم أول تذكرة</label><input inputmode="numeric" value="${s.firstTicket}" placeholder="مثال: 20280" oninput="s.firstTicket=this.value.replace(/\\D/g,'');save();updateAudit()"></div><div class="field"><label>رقم آخر تذكرة</label><input inputmode="numeric" value="${s.lastTicket}" placeholder="مثال: 20297" oninput="s.lastTicket=this.value.replace(/\\D/g,'');save();updateAudit()"></div><div id="auditResult">${auditResult(n,rec,expMoney,recMoney,diff)}</div></div>`;
}
function auditResult(n,rec,expMoney,recMoney,diff){
if(s.firstTicket===''||s.lastTicket==='')return `<div class="audit"><div class="label">أدخل أول وآخر رقم تذكرة لبدء المراجعة.</div></div>`;
if(n===null)return `<div class="audit"><div class="bad">⚠ رقم آخر تذكرة يجب أن يكون أكبر من أو يساوي رقم البداية.</div></div>`;
return `<div class="audit"><div class="auditline"><span>عدد التذاكر حسب الأرقام</span><strong>${fmt(n)}</strong></div><div class="auditline"><span>المسجل في المبيعات</span><strong>${fmt(rec)}</strong></div><div class="auditline"><span>فرق العدد</span><strong class="${diff===0?'ok':'bad'}">${diff===0?'0 ✓':fmt(Math.abs(diff))+(diff>0?' أقل من المفروض':' زيادة')}</strong></div><div class="auditline"><span>القيمة المفترضة</span><strong>${fmt(expMoney)} ج</strong></div><div class="auditline"><span>القيمة المسجلة</span><strong>${fmt(recMoney)} ج</strong></div><div class="auditline"><span>فرق القيمة</span><strong class="${expMoney===recMoney?'ok':'bad'}">${fmt(Math.abs(expMoney-recMoney))} ج</strong></div><div style="margin-top:12px;text-align:center;font-size:19px;font-weight:900" class="${diff===0&&expMoney===recMoney?'ok':'bad'}">${diff===0&&expMoney===recMoney?'✓ التذاكر والفلوس مطابقين':'⚠ يوجد اختلاف — راجع التذاكر'}</div></div>`;
}
function updateAudit(){const n=ticketExpected(),r=s.counts.ticket;document.getElementById('auditResult').innerHTML=auditResult(n,r,ticketExpectedMoney(),r*s.prices.ticket,n===null?null:n-r)}
function closeScreen(){
const sales=totalSales(),cash=cashTotal(),diff=cash-sales,tn=ticketExpected(),tdiff=tn===null?null:tn-s.counts.ticket;
const good=diff===0&&(tdiff===null||tdiff===0);
return header('إغلاق الحساب','المراجعة النهائية للشيفت')+`<div class="statgrid"><div class="stat"><span>إجمالي المبيعات</span><b>${fmt(sales)} ج</b></div><div class="stat"><span>إجمالي النقدية</span><b>${fmt(cash)} ج</b></div><div class="stat"><span>فرق النقدية</span><b class="${diff===0?'ok':'bad'}">${fmt(Math.abs(diff))} ج</b></div><div class="stat"><span>فرق التذاكر</span><b class="${tdiff===null||tdiff===0?'ok':'bad'}">${tdiff===null?'—':fmt(Math.abs(tdiff))}</b></div></div><div class="panel" style="text-align:center;border-color:${good?'rgba(69,239,174,.5)':'rgba(255,91,121,.45)'}"><div style="font-size:55px">${good?'✓':'⚠'}</div><div style="font-size:26px;font-weight:900;color:${good?'var(--green)':'var(--red)'}">${good?'مطابق تمامًا':(diff<0?'عجز':'زيادة')}</div><div class="label">${good?'مفيش عجز أو زيادة':`${fmt(Math.abs(diff))} ج فرق في النقدية`}</div></div><button class="btn ${good?'success':'warn'}" style="width:100%;margin-top:12px" onclick="saveDay()">${good?'✓ حفظ اليوم':'حفظ اليوم رغم وجود فرق'}</button>`;
}
function saveDay(){const item={date:s.day,counts:{...s.counts},cash:{...s.cash},prices:{...s.prices},firstTicket:s.firstTicket,lastTicket:s.lastTicket,sales:totalSales(),cashTotal:cashTotal(),difference:cashTotal()-totalSales(),ticketCount:ticketExpected(),ticketRecorded:s.counts.ticket};s.history=[item,...(s.history||[]).filter(x=>x.date!==s.day)].slice(0,100);save();toast('تم حفظ اليوم في السجل','success');setTimeout(()=>setScreen('history'),600)}
function history(){
return header('سجل الأيام','كل يوم محفوظ عندك')+(s.history&&s.history.length?s.history.map((x,i)=>`<div class="historyItem"><div class="historyTop"><strong>${x.date}</strong><span class="badge">${x.difference===0?'✓ مطابق':'مراجعة'}</span></div><div class="auditline"><span>المبيعات</span><strong>${fmt(x.sales)} ج</strong></div><div class="auditline"><span>النقدية</span><strong>${fmt(x.cashTotal)} ج</strong></div><div class="auditline"><span>التذاكر</span><strong>${x.ticketCount==null?'—':fmt(x.ticketCount)} / ${fmt(x.ticketRecorded)}</strong></div></div>`).join(''):`<div class="panel empty">📅<br><br>لسه مفيش أيام محفوظة<br><span>بعد أول إغلاق للحساب هتلاقي التفاصيل هنا.</span></div>`)}
function settings(){
return header('الإعدادات','تخصيص الشيفت')+`<div class="panel"><div class="sectionHead" style="margin-top:0"><h2>أسعار الخدمات</h2></div>${[['ticket','تذكرة الاسكيت'],['dolphin','دولفين / سنادة'],['cart','عربية بضائع'],['subs','اشتراك']].map(([k,n])=>`<div class="settingsRow"><div><strong>${n}</strong><div class="tiny">السعر بالجنيه</div></div><input style="width:105px;text-align:center" inputmode="numeric" value="${s.prices[k]}" onchange="setPrice('${k}',this.value)"></div>`).join('')}</div><div class="panel"><div class="sectionHead" style="margin-top:0"><h2>تفضيلات الكاشير</h2></div>${toggle('sounds','المؤثرات الصوتية','🔊')}${toggle('vibrate','الاهتزاز','⚡')}${toggle('visuals','المؤثرات البصرية','✦')}</div><div class="panel"><button class="btn warn" style="width:100%" onclick="resetAll()">مسح بيانات التطبيق</button></div>`;
}
function toggle(k,label,ico){return `<div class="settingsRow"><div><strong>${ico} ${label}</strong></div><button class="switch ${s[k]?'on':''}" onclick="s['${k}']=!s['${k}'];save();render()"><i></i></button></div>`}
function setPrice(k,v){s.prices[k]=Math.max(0,Number(v)||0);save();toast('تم تحديث السعر','success')}
function resetAll(){if(confirm('هل تريد مسح كل البيانات؟')){localStorage.removeItem(KEY);location.reload()}}
function nav(){const items=[['home','الرئيسية','⌂'],['ops','العمليات','⌁'],['cash','عد الفلوس','▣'],['history','سجل الأيام','◷'],['settings','الإعدادات','⚙']];return `<nav class="bottom">${items.map(([k,n,i])=>`<button class="nav ${screen===k?'active':''}" onclick="setScreen('${k}')"><span>${i}</span>${n}</button>`).join('')}</nav>`}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
